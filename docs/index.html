<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>金秋大促 · 活动报名摸排</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page narrow">
  <header class="hero">
    <div class="hero-tag">视频号电商 · 品牌客户摸排</div>
    <h1>金秋大促 · 活动报名摸排</h1>
    <p class="hero-desc">请按活动分别填写。每个活动一个独立入口，互不影响，填完一个可以接着填另一个。</p>
  </header>

  <div class="entry-grid" id="entryGrid"></div>

  <section class="card" style="margin-top:18px">
    <h2><span class="idx">?</span>填写说明</h2>
    <ol class="guide">
      <li>选择客户 —— 输入客户简称，系统自动带出该客户的主推商品</li>
      <li>确认是否有资格报名<br/>
        <span class="guide-sub">· 没资格 → 填写店铺分等原因，并告诉我们是否需要协助沟通<br/>
        · 有资格 → 进入第 3 步</span></li>
      <li>按商品逐个选择提报情况：<b>已提报</b>（填价格）/ <b>择机报</b>（填预计时间）/ <b>未提报</b>（选原因）</li>
      <li>确认无误后提交</li>
    </ol>
    <p class="sub" style="margin:14px 0 0">填写过程会自动保存草稿，中途关掉页面再回来不会丢。</p>
  </section>
</div>

<script src="config.js"></script>
<script src="products-data.js"></script>
<script src="schema.js"></script>
<script>
(function () {
  var SCH = window.HBSchema;
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  };
  document.getElementById('entryGrid').innerHTML = SCH.ACTIVITY_DEFS.map(function (a) {
    return '<a class="entry-card" href="' + a.page + '" style="--act:' + a.color + '">'
      + '<div class="entry-name">' + esc(a.name) + '</div>'
      + '<div class="entry-desc">' + esc(a.desc) + '</div>'
      + '<div class="entry-go">开始填写 →</div></a>';
  }).join('');
})();
</script>
</body>
</html>
