<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><title>拉取自检</title>
<style>body{font:14px/1.8 -apple-system,"PingFang SC",sans-serif;padding:24px;max-width:820px}
pre{background:#f5f7fa;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
.ok{color:#06a552;font-weight:600}.bad{color:#d4380d;font-weight:600}</style>
</head>
<body>
<h2>merge 拉取链路自检</h2>
<p>用于诊断「拉取失败」。会依次测试：配置读取 → 浏览器直连 GitHub API → gh.js 完整拉取。</p>
<pre id="out">运行中…</pre>

<script src="config.js"></script>
<script src="schema.js"></script>
<script src="gh.js"></script>
<script>
var log = [];
function put(s, cls) {
  log.push(cls ? '<span class="' + cls + '">' + s + '</span>' : s);
  document.getElementById('out').innerHTML = log.join('\n');
}

(function run() {
  var CFG = window.HB_CONFIG || {};
  var GH = window.HBGitHub;

  put('1) 配置读取');
  put('   repo      = ' + (GH.repo() || '(空)'));
  put('   readable  = ' + GH.readable());
  put('   enabled   = ' + GH.enabled() + '  (false 表示 token 没读到)');
  put('');

  put('2) 浏览器直连 GitHub API（关键：验证 CORS）');
  var url = 'https://api.github.com/repos/' + GH.repo() + '/issues?state=open&per_page=1&_=' + Date.now();
  fetch(url, {
    headers: { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
  }).then(function (r) {
    put('   HTTP ' + r.status + (r.ok ? '  ✓ CORS 通过' : '  ✗'), r.ok ? 'ok' : 'bad');
    return r.json();
  }).then(function (j) {
    put('   返回类型 = ' + (Array.isArray(j) ? 'Array(' + j.length + ')' : typeof j));
    if (!Array.isArray(j) && j && j.message) put('   message = ' + j.message, 'bad');
    put('');
    put('3) gh.js 完整拉取');
    return GH.list();
  }).then(function (l) {
    put('   ✓ 成功，读回 ' + l.length + ' 份问卷', 'ok');
    l.forEach(function (r) {
      put('     #' + r.__issue + '  ' + r.brand + '  商品' + (r.products || []).length + '个');
    });
    put('');
    put('结论：拉取链路正常，merge.html 可用。', 'ok');
  }).catch(function (e) {
    put('   ✗ 失败：' + e.message, 'bad');
    put('');
    put('排查方向：', 'bad');
    put('  · 提示"无法连接"→ 网络/代理无法访问 api.github.com');
    put('  · 提示 401     → token 失效，重新生成后跑 set_token.py');
    put('  · 提示 403     → 权限不足或触发限流');
    put('  · 其他         → 把这整段截图发我');
  });
})();
</script>
</body>
</html>
