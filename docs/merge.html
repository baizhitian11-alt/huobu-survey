<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>货补摸排 · 汇总导出（运营用）</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">
  <header class="hero" style="padding:22px 24px">
    <div class="hero-tag">运营侧工具 · 打开自动加载最新数据</div>
    <h1 style="font-size:21px;margin-bottom:4px">货补摸排 · 汇总导出</h1>
    <p class="hero-desc">
      客户在线提交的会自动同步进来；客户回传的 <code>.hbjson</code> 文件可拖进下方区域一并汇总（自动去重）。
      <span id="repoTip" style="display:block;margin-top:6px"></span>
    </p>
  </header>

  <section class="card">
    <div class="admin-bar">
      <button class="btn primary" id="btnPull">刷新数据</button>
      <button class="btn ghost" id="btnExport">导出 Excel</button>
      <button class="btn ghost" id="btnExportJson">导出 JSON 备份</button>
      <button class="btn ghost" id="btnClear">清空列表</button>
      <span class="hint" id="status">加载中…</span>
    </div>

    <div class="xls-tabs" id="actFilter" style="margin-top:4px"></div>
    <div class="stat-grid" id="stats"></div>

    <div class="drop" id="drop" style="margin-top:14px;padding:20px">
      <div><b>把客户回传的回执文件拖到这里</b>，或 <button class="link-btn" id="btnPick">选择文件</button></div>
      <div class="hint" style="margin-top:4px">支持 .hbjson / .json，可多选</div>
      <input type="file" id="file" multiple accept=".hbjson,.json,application/json" style="display:none" />
    </div>
  </section>

  <section class="card">
    <h2><span class="idx">≡</span>提交明细</h2>
    <div class="tbl-wrap" style="margin-top:12px">
      <table class="tbl" id="list">
        <thead><tr>
          <th>提交时间</th><th>活动</th><th>客户名称</th>
          <th>资格</th><th>提报情况</th><th>商品数</th><th>编号</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2><span class="idx">⊞</span>Excel 数据预览 <span class="tag">与导出文件一致</span></h2>
    <p class="sub">切 tab 看两个 Sheet，不下载也能核对。当前受上方活动筛选影响。</p>
    <div id="preview"></div>
  </section>
</div>

<script src="config.js"></script>
<script src="schema.js"></script>
<script src="xlsx.js"></script>
<script src="preview.js"></script>
<script src="gh.js"></script>
<script src="merge.js"></script>
</body>
</html>
