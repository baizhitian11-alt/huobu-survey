<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>腾讯营销 × 鹅选美妆节 · 双11大促招募令</title>
<link rel="stylesheet" href="style.css?v=20261022b" />
</head>
<body class="ex-page">
<div class="page">
  <header class="hero act-hero ex-hero">
    <div class="act-nav" id="actNav"></div>
    <div class="ex-head">
      <div class="ex-head-txt">
        <h1 id="exTitle">腾讯营销 × 鹅选美妆节</h1>
        <p class="hero-desc" id="exSub"></p>
      </div>
      <div class="ex-logo" id="exLogo" style="display:none"></div>
    </div>
    <div class="ex-rights" id="exRights"></div>
  </header>

  <main>
    <!-- ════════ 美力值TOP品牌榜单（数据由工作台「更新榜单」发布到仓库 data 分支） ════════ -->
    <section class="card lb-card" id="lbCard" style="display:none">
      <h2 class="ex-part"><span id="lbTitle"></span></h2>
      <div class="lb-reward" id="lbReward"></div>
      <div class="lb-note" id="lbNote"></div>
      <div class="lb-list" id="lbList"></div>
      <div class="lb-foot" id="lbFoot"></div>
    </section>

    <!-- 品牌名称：上下两部分共用 -->
    <section class="card">
      <h2><span class="idx">1</span>品牌名称</h2>
      <label class="field" style="max-width:520px">
        <span class="label">品牌名称 <span class="req">*</span></span>
        <input id="brand" list="brandList" placeholder="输入品牌简称，如：百雀羚" autocomplete="off" />
        <datalist id="brandList"></datalist>
        <span class="hint" id="brandHint">报名和凭证上传都按品牌名称关联，请保持一致</span>
      </label>
    </section>

    <!-- ════════ 上半部分：报规划（限时） ════════ -->
    <section class="card">
      <h2 class="ex-part"><span id="p1Title"></span></h2>
      <div class="ex-time" id="p1Time"></div>
      <div class="deadline-box light" id="deadlineBox" style="display:none"></div>
      <div id="questionBox"></div>
      <label class="field" style="margin-top:18px">
        <span class="label">备注（选填）</span>
        <textarea id="remark" rows="2" placeholder="其他想补充的信息"></textarea>
      </label>
      <div class="ex-submit-row">
        <span class="hint" id="p1State"></span>
        <div class="btns">
          <button class="btn ghost" id="btnClear">清空</button>
          <button class="btn primary" id="btnSubmit">提交报规划</button>
        </div>
      </div>
    </section>

    <!-- ════════ 下半部分：传凭证（随时） ════════ -->
    <section class="card" id="voucherCard">
      <h2 class="ex-part"><span id="p2Title"></span><span class="tag-anytime">随时可传</span></h2>
      <div class="ex-time" id="p2Time"></div>
      <div class="ex-rank" id="p2Rank"></div>

      <div class="ex-uphint">每个排位事项在右侧「上传凭证」里单独上传，一次可选多张，周期内随时可传；支持图片 / PDF（手机原图会自动压缩，PDF 单个 ≤25MB）。已传的凭证就显示在对应格子里，点缩略图可查看。</div>

      <!-- 排位事项表：每行自带上传入口 -->
      <div class="tbl-wrap" id="rkTable"></div>
      <input type="file" id="vFile" multiple style="display:none" />

      <div class="ex-submit-row" style="margin-top:10px">
        <span class="hint" id="vStatus"></span>
        <button class="link-btn" id="btnMine">刷新已传凭证</button>
      </div>
    </section>
  </main>
</div>

<div class="mask" id="doneMask">
  <div class="done">
    <div class="done-icon">✓</div>
    <h3 id="doneTitle">提交成功！</h3>
    <p id="doneId"></p>
    <div class="btns" id="doneBtns"></div>
  </div>
</div>

<div class="mask" id="imgMask">
  <img id="imgBig" alt="" />
</div>

<!-- 每张凭证的附加信息（如大场时间 / 大场主题）：选完文件后逐张填写 -->
<div class="mask" id="vMetaMask">
  <div class="vmm">
    <div class="vmm-hd"><b id="vmmTitle">填写凭证信息</b></div>
    <div class="vmm-tip" id="vmmTip"></div>
    <div class="vmm-list" id="vmmList"></div>
    <div class="vmm-ft">
      <button class="btn ghost sm" id="vmmCopy">首张信息应用到全部</button>
      <span class="vmm-sp"></span>
      <button class="btn ghost" id="vmmCancel">取消</button>
      <button class="btn primary" id="vmmOk">确认上传</button>
    </div>
  </div>
</div>

<script src="config.js?v=20261022b"></script>
<script src="exuan-config.js?v=20261022b"></script>
<script src="products-data.js?v=20261022b"></script>
<script src="schema.js?v=20261022b"></script>
<script src="gh.js?v=20261022b"></script>
<script src="exuan.js?v=20261022b"></script>
</body>
</html>
